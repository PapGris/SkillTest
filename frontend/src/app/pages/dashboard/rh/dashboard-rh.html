<nav class="onglets">
  <button
    type="button"
    class="onglet"
    [class.actif]="ongletActif() === 'vue-ensemble'"
    (click)="choisirOnglet('vue-ensemble')"
  >
    Vue d'ensemble
  </button>
  <button
    type="button"
    class="onglet"
    [class.actif]="ongletActif() === 'competences'"
    (click)="choisirOnglet('competences')"
  >
    Competences
  </button>
  <button
    type="button"
    class="onglet"
    [class.actif]="ongletActif() === 'rapports'"
    (click)="choisirOnglet('rapports')"
  >
    Rapports
  </button>
  <button
    type="button"
    class="onglet"
    [class.actif]="ongletActif() === 'collaborateurs'"
    (click)="choisirOnglet('collaborateurs')"
  >
    Collaborateurs
  </button>
</nav>

<div class="contenu-onglet">
  @switch (ongletActif()) {
    @case ('vue-ensemble') {
      <app-onglet-vue-ensemble />
    }
    @case ('competences') {
      <app-onglet-competences />
    }
    @case ('rapports') {
      <app-onglet-rapports />
    }
    @case ('collaborateurs') {
      <app-onglet-collaborateurs />
    }
  }
</div>
